<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="nav__inner">
    <a routerLink="/products" class="nav__logo" (click)="closeMenu()" aria-label="Go to products homepage">
      <span class="nav__logo-mark" aria-hidden="true">◈</span>
      <span class="nav__logo-wordmark">My Products</span>
    </a>

    <nav class="nav__links" [class.nav__links--open]="menuOpen()" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="nav__link--active"
          class="nav__link"
          (click)="closeMenu()">
          {{link.label}}
        </a>
      }
    </nav>

    <div class="nav__actions">
      <button
        class="nav__hamburger"
        [class.nav__hamburger--open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
